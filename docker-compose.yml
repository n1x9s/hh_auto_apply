services:
  hh_applicant_tool:
    container_name: hh_applicant_tool
    image: hh_applicant_tool:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      # Пробрасываем таймзону хоста
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    environment:
      # Это не трогаем
      - CONFIG_DIR=/app/config
      # Смените или закомментируйте при проблемах
      - TERM=${TERM}
      # Если время на сервере отличается
      # - TZ=Europe/Moscow

  # Веб-интерфейс
  hh_web:
    container_name: hh_web
    extends: hh_applicant_tool
    ports:
      - "8080:8080"
    command: hh-applicant-tool serve --host 0.0.0.0 --port 8080 --no-browser
    restart: unless-stopped
