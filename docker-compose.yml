services:
  hh_app:
    container_name: hh_app
    image: hh_app_go:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config:/app/config
      # Пробрасываем таймзону хоста
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    environment:
      # Это не трогаем
      - CONFIG_DIR=/app/config
      # Смените или закомментируйте при проблемах
      - TERM=${TERM}
      # Если время на сервере отличается
      # - TZ=Europe/Moscow
    command: daemon

  # Веб-интерфейс
  hh_web:
    container_name: hh_web
    extends: hh_app
    ports:
      - "127.0.0.1:8080:8080"
    command: serve --host 0.0.0.0 --port 8080
    restart: unless-stopped
